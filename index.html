<h1>gmail-sync</h1>
<p>A personal tool that keeps a private, read-only backup of one Gmail account on its owner's home server, using <a href="https://github.com/gauteh/lieer">lieer</a> and notmuch.</p>
<p>It is not offered to anyone else, and only its owner can sign in to it.</p>
